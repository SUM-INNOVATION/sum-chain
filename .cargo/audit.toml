# cargo-audit (RustSec) configuration — #127 item 5.
#
# `cargo audit` is the ACTIVE RustSec vulnerability gate (cargo-deny's advisory
# loader cannot parse the current DB's CVSS-4.0 entries, so advisories run here
# while license/source/duplicate policy runs under cargo-deny — see deny.toml).
#
# cargo audit FETCHES THE LIVE advisory database on every run, so a newly
# published advisory against an already-present crate FAILS the build even though
# it is not listed below. The list here is a small set of individually-justified,
# TRACKED pre-existing advisories, NONE in the beacon crypto path, each needing a
# MAJOR cross-stack bump handled outside #127.
#
# Umbrella tracking issue: SUM-INNOVATION/sum-chain#200, decomposed into SIX
# remediation tracks (#202–#207). Each exception below records its child issue,
# dependency path, owning area, target release, and EXPIRY condition. When a track
# is remediated, delete its line here AND in deny.toml so the gate re-tightens;
# keep the two lists identical.
#
# Blocker classification:
#   * PRODUCTION tracks (#202/#203/#204) — HARD BLOCKERS for the consolidated
#     mainnet release.
#   * DEV tracks (#205/#206/#207) — signed-release blockers ABSENT explicit
#     security-owner acceptance.
#
# Reviewed snapshot: rustsec/advisory-db@4b27756f (2026-09-01).
# Full context + license/dependency inventory: docs/security/DEPENDENCY-AUDIT.md.

[advisories]
ignore = [
    # ── ALL SIX #200 tracks and #306 are remediated. The list is empty. ──
    # #202 RESOLVED — hickory-proto RUSTSEC-2026-0119: libp2p de-umbrellaed and
    #   libp2p-mdns dropped; crate absent from graph and lock.
    # #203 RESOLVED — rkyv RUSTSEC-2026-0235: wasmer 5.0.6 pulls rkyv >= 0.8.17.
    # #204 RESOLVED — time RUSTSEC-2026-0009: MSRV bump + time >= 0.3.47.
    # #205 RESOLVED — h2 RUSTSEC-2026-0258: jsonrpsee 0.21 -> 0.26 and reqwest
    #   0.11 -> 0.12 move everything onto hyper 1.x; h2 0.3 has left the lock.
    # #206 RESOLVED — ring RUSTSEC-2025-0009: the bridge no longer depends on
    #   ethers, so jsonwebtoken -> ring 0.16 is gone from graph and lock.
    # #207 RESOLVED — rustls-webpki RUSTSEC-2026-0104/0098/0099: the legacy
    #   rustls 0.21 line came in via jsonrpsee 0.21's http client and ethers'
    #   reqwest 0.11; both are gone, leaving only rustls-webpki 0.103.
    # #306 RESOLVED — ruzstd RUSTSEC-2026-0344: object 0.32.2 is patched to a
    #   vendored copy (crates/third_party/object-0.32.2) whose only change is
    #   dropping "compression" from its default features, so ruzstd 0.5.0 has
    #   left graph and lock. cargo audit matches no advisory against that path
    #   crate, so `scripts/check-vendored-object.sh advisories` audits its
    #   crates.io identity (object 0.32.2) against this same file, in
    #   supply-chain-audit and daily; see docs/security/DEPENDENCY-AUDIT.md.
    #
    # ── SCOPED EXCEPTIONS (2026-10-21), guarded by scripts/check-webpki-shims.sh ──
    # Both are 0.26.11 compatibility shims whose whole API is a re-export of the
    # 1.x crate, which Cargo.lock resolves to the fixed 1.0.10 (no emSign ECC Root
    # CA - G3). The 1.x copies of both crates are at 1.0.10, so neither advisory
    # applies to them. cargo-audit ignores are per ID: the guard fails CI if any
    # premise below stops holding, including any 1.x copy dropping below 1.0.10.
    # Review by 2026-11-21 (or the next release decision, whichever is first).
    #
    # RUSTSEC-2026-0381, webpki-roots 0.26.11 ONLY (src/lib.rs:33
    #   `pub use parent::TLS_SERVER_ROOTS`; parent = webpki-roots "1" -> 1.0.10).
    #   Path: ureq 2.12.1 <- [build-dependencies] wasmer 5.0.6 <- sumc-runtime.
    #   No normal-dependency path on any target. ureq runs only in wasmer's
    #   build.rs, and its calls (build.rs:44, :192) are under the "wamr"/"v8"
    #   features, which are not enabled.
    #   Remove when: wasmer leaves 5.0.6 (a separate engine/MSRV decision) or
    #   ureq leaves wasmer's build-dependencies.
    "RUSTSEC-2026-0381",
    # RUSTSEC-2026-0383, webpki-root-certs 0.26.11 ONLY (src/lib.rs:31
    #   `pub use parent::TLS_SERVER_ROOT_CERTS`; parent = webpki-root-certs "1"
    #   -> 1.0.10). Path: rustls-platform-verifier 0.5.3 (a wasm32-only
    #   dependency, its Cargo.toml:118-119) <- jsonrpsee-http-client 0.26 <-
    #   node/rpc/wallet. Not built for any shipped target.
    #   Remove when: a jsonrpsee release depends on rustls-platform-verifier
    #   >= 0.6 (1.x roots) within MSRV 1.88, and sum-chain moves to it.
    "RUSTSEC-2026-0383",
]
