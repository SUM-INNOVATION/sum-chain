name: Automated review

# Independent automated-review gate (#219) — the mandatory check that REPLACES
# the human-approval *count* in the branch-protection ruleset.
#
# Why this replaces `approval-policy`:
#   The old gate ran ONLY on `pull_request_review`. So when a branch was updated
#   (the strict "must be up to date" rule forces this after every other merge),
#   no review event fired on the new head, the required check was never produced,
#   and the PR sat at "Expected — waiting for status" forever unless a human
#   re-approved the new head. Worse, an approval could be re-associated to a head
#   the reviewer never saw. This workflow runs on the PR lifecycle instead, so a
#   fresh verdict is always produced for the CURRENT head.
#
# Guarantees (all enforced by .github/scripts/automated_review.py, fail-closed):
#   1. Never merely "Expected" because the branch moved — `synchronize` always
#      produces a run for the new head.
#   2. Validates the PR's CURRENT head SHA, never an older reviewed head; a run
#      whose head has been superseded fails.
#   3. Requires every designated CI/security check to be completed+success ON the
#      current head (a stale success against an older head does not count).
#   4. Refuses self-weakening: a PR touching the governance gate files needs a
#      qualifying admin/maintainer approval on the current head.
#   5. Re-asserts strict "branch must be up to date" (behind_by == 0). It does not
#      replace that branch-protection rule — both stay on.
#
# SECURITY — the evaluator is never the PR's own code:
#   `pull_request` (NOT `pull_request_target`) runs the workflow file from the
#   BASE branch, with a read-only token and no secrets. The gate job additionally
#   checks out `base.sha`, so the script + config it executes are the base's
#   versions. A PR's edits to those files are DETECTED via the API diff (rule 4)
#   and never executed. Fork PRs are evaluated identically.
#
# There is deliberately NO `workflow_dispatch` recovery path: GitHub does not
# count a manually-dispatched run toward a PR's required checks, so offering one
# only misleads (that was a real trap in the previous mechanism).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  # Newest head wins: a superseded run is cancelled, and the fresh run for the
  # new head is the authoritative verdict for that head.
  group: automated-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automated-review:
    name: automated-review
    runs-on: ubuntu-latest
    steps:
      # Base version ONLY — never the PR's version of the evaluator.
      - name: Check out BASE (evaluator must not come from the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Independent automated review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/automated_review.py \
            --owner "${{ github.repository_owner }}" \
            --repo  "${{ github.event.repository.name }}" \
            --pr    "${{ github.event.pull_request.number }}" \
            --run-head-sha "${{ github.event.pull_request.head.sha }}"

  # Validates a PROPOSED change to the gate: runs the PR's own decision tests
  # against the PR's own script. Informative — it does not replace the admin
  # approval that rule 4 requires for a gate change.
  automated-review-tests:
    name: automated-review-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decision-core unit tests
        run: python3 .github/scripts/automated_review_test.py
