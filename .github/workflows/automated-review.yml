name: Automated review

# Independent automated-review gate (#219) — the mandatory check that REPLACES
# the human-approval *count* in the branch-protection ruleset.
#
# Why this replaces `approval-policy`:
#   The old gate ran ONLY on `pull_request_review`. So when a branch was updated
#   (the strict "must be up to date" rule forces this after every other merge),
#   no review event fired on the new head, the required check was never produced,
#   and the PR sat at "Expected — waiting for status" forever unless a human
#   re-approved the new head. Worse, an approval could be re-associated to a head
#   the reviewer never saw. This workflow runs on the PR lifecycle instead, so a
#   fresh verdict is always produced for the CURRENT head.
#
# Guarantees (all enforced by .github/scripts/automated_review.py, fail-closed):
#   1. Never merely "Expected" because the branch moved — `synchronize` always
#      produces a run for the new head.
#   2. Validates the PR's CURRENT head SHA, never an older reviewed head; a run
#      whose head has been superseded fails.
#   3. Requires every designated CI/security check to be completed+success ON the
#      current head (a stale success against an older head does not count).
#   4. Refuses self-weakening: a PR touching the governance gate files needs a
#      qualifying admin/maintainer approval on the current head.
#   5. Re-asserts strict "branch must be up to date" (behind_by == 0). It does not
#      replace that branch-protection rule — both stay on.
#
# SECURITY — scope and residual risk (stated precisely, not overclaimed):
#   * `pull_request` (NOT `pull_request_target`) gives a read-only token and no
#     secrets, and its check-run attaches to the PR's HEAD SHA — which is what a
#     required status check must land on. (`pull_request_target` would run the
#     BASE's workflow file, but its run attaches to the base SHA and so cannot
#     satisfy a head-SHA required check; and GitHub no longer lets a workflow
#     publish its own check-run/status to the head. Hence `pull_request`.)
#   * POLICY INTEGRITY IS GUARANTEED: this job checks out `base.sha`, so the
#     decision script and config it executes are always the BASE's versions. A
#     PR cannot change the policy logic that judges it; its edits to those files
#     are DETECTED via the API diff (clause 4) and never executed.
#   * RESIDUAL RISK, honestly: on `pull_request` the *workflow file itself* comes
#     from the merge ref, so a PR that rewrites THIS file (e.g. to skip the
#     script) would run its rewritten version. Clause 4 cannot catch that, since
#     the gutted job never calls the script. Deleting/renaming the job is safe —
#     the required `automated-review` context is then never produced and the PR
#     stays blocked — but a trivially-passing rewrite is not self-detectable.
#     Mitigate at the platform layer: restrict `.github/workflows/**` via a
#     ruleset path rule, or require admin review for `.github/**` changes. See
#     docs/governance/AUTOMATED-REVIEW.md ("Residual risk").
#   Fork PRs are evaluated identically (read-only token, no secrets).
#
# There is deliberately NO `workflow_dispatch` recovery path: GitHub does not
# count a manually-dispatched run toward a PR's required checks, so offering one
# only misleads (that was a real trap in the previous mechanism).

on:
  # PRIMARY — the PR lifecycle. Every new head gets a fresh verdict, so the check
  # is never merely "Expected" because the branch moved (the #219 defect).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # ADDITIVE — re-evaluate when a review is submitted or dismissed. Required for
  # clause 4 to be workable: a gate-changing PR needs an admin approval ON THE
  # CURRENT HEAD, but an approval is not a PR lifecycle event, so without this the
  # check would keep its pre-approval verdict. Pushing to force a re-run does not
  # help — `dismiss_stale_reviews` drops the approval on the new head, so approve
  # -> push -> dismissed -> approve loops forever (the only escape being a manual
  # "Re-run jobs"). This trigger closes that loop.
  #
  # It does NOT reintroduce the original catch-22: the gate is never review-EVENT-
  # ONLY, because the lifecycle triggers above still produce a verdict for every
  # head on their own. Reviews only ever ADD an evaluation.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  # Newest head wins: a superseded run is cancelled, and the fresh run for the
  # new head is the authoritative verdict for that head.
  group: automated-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automated-review:
    name: automated-review
    runs-on: ubuntu-latest
    steps:
      # Base version ONLY — never the PR's version of the evaluator.
      - name: Check out BASE (evaluator must not come from the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Independent automated review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/automated_review.py \
            --owner "${{ github.repository_owner }}" \
            --repo  "${{ github.event.repository.name }}" \
            --pr    "${{ github.event.pull_request.number }}" \
            --run-head-sha "${{ github.event.pull_request.head.sha }}"

  # Validates a PROPOSED change to the gate: runs the PR's own decision tests
  # against the PR's own script. Informative — it does not replace the admin
  # approval that rule 4 requires for a gate change.
  automated-review-tests:
    name: automated-review-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decision-core unit tests
        run: python3 .github/scripts/automated_review_test.py
