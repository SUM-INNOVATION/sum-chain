name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-clippy:
    # x86_64 (ubuntu-latest). This job keeps the EXACT name `build-test-clippy`
    # so it matches the branch-protection required status check; do not add a
    # matrix here (a matrix would rename the check to `build-test-clippy (...)`
    # and break the required context). The aarch64 leg is a separate job below.
    runs-on: ubuntu-latest
    env:
      # librocksdb-sys bundles + compiles RocksDB; GCC 13+ on modern ubuntu
      # images needs <cstdint> force-included (documented repo workaround). If
      # the RocksDB build still fails, fall back to `runs-on: ubuntu-22.04`.
      CXXFLAGS: "-include cstdint"
      # Disk headroom: line tables only (file:line in backtraces and panics
      # kept) instead of full debug info in the dev and test profiles. Release
      # builds are not affected. With full debug info this job once ran out of
      # runner disk linking the workspace's test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # rustup on the runner reads rust-toolchain.toml and installs the pinned
      # channel (1.88.0). Single source of truth — no version hardcoded here, so
      # bumping rust-toolchain.toml updates CI automatically. `rustup show`
      # forces the install; clippy is in the default profile but added explicitly.
      - name: Set up pinned toolchain
        run: |
          rustup show
          rustup component add clippy

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # A separate cache key: never restore a target directory built with
      # full debug info into these line-table builds.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: dev-debug-line-tables-only

      # #117 CONSOLIDATE leaf-guard: `sumchain-wire` is the single source-of-truth for every
      # wire/primitive byte-format and MUST stay a pure LEAF — it may depend on external crates only,
      # never on a workspace-internal crate. Every internal dependency takes the form of a `path`
      # dependency, so any path dep of `sumchain-wire` is a wrong-way edge and fails the guard.
      # `cargo metadata` resolves without building; jq is preinstalled on ubuntu-latest.
      - name: sumchain-wire leaf-dependency guard (#117)
        run: |
          bad=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="sumchain-wire") | .dependencies[] | select(.path != null) | .name')
          if [ -n "$bad" ]; then
            echo "::error::sumchain-wire must stay a pure leaf (single wire source-of-truth) but has workspace-internal (path) deps: $bad"
            exit 1
          fi
          echo "ok - sumchain-wire is a pure leaf (no workspace-internal dependencies)"

      # #127 reconciliation guard: fail if any SUPERSEDED beacon construct (the dead
      # ECIES :key/:aad tags, XChaCha20 / Ristretto / Curve25519 / zero-nonce in
      # beacon code, hardcoded finality_depth(6), or the stale "carriers not landed"
      # comment) re-appears. Ratified rejection NOTES in doc-comments/spec are allowed.
      - name: BR1 reconciliation regression guard (#127)
        run: bash scripts/br1-reconciliation-guard.sh

      # Disk headroom (the x86_64 job once ran out of space linking test
      # binaries): the runner's free space and what the build tree holds.
      - name: Disk usage before build
        run: |
          df -h /
          du -sh target "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Disk usage after build and test
        if: always()
        run: |
          df -h /
          du -sh target target/debug/deps target/debug/build "$HOME/.cargo/registry" 2>/dev/null || true

      # Error-gated only: catches clippy/compile-error regressions. The workspace
      # is not yet warning-clean, so `-D warnings` is deferred to a separate
      # cleanup PR to avoid turning legacy warnings into unrelated blockers.
      - name: Clippy (workspace, tests)
        run: cargo clippy --workspace --tests --locked

  supply-chain-audit:
    # #127 item 5 — dependency supply-chain gate.
    #   * cargo-deny  -> license / source / duplicate (multiple-versions) policy (deny.toml)
    #   * cargo-audit -> RustSec advisories (.cargo/audit.toml tracked exceptions)
    # cargo-audit runs the advisory check (cargo-deny's loader cannot parse the
    # DB's CVSS-4.0 entries). Both tools are lockfile/metadata-based and
    # architecture-independent, so a single lane suffices. cargo audit FETCHES the
    # live advisory DB every run, so a NEW advisory not listed in .cargo/audit.toml
    # FAILS the build — the tracked list only defers the pre-existing ones in #200.
    #
    # NOTE: like build-test-clippy-aarch64, this runs on every PR/push but is NOT
    # yet a branch-protection required context. To make it a MERGE GATE, an admin
    # must add `supply-chain-audit` to main's required status checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain
        run: rustup show

      - name: Install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo-deny — license / source / duplicate policy
        run: cargo deny --locked check licenses sources bans

      - name: cargo-audit — RustSec advisories (fails on any advisory not tracked in .cargo/audit.toml)
        run: cargo audit

      # The scoped RUSTSEC-2026-0381 / -0383 exceptions in .cargo/audit.toml hold
      # only while their premises do (reviewed shim releases, fixed 1.x data,
      # no shipped-target path). This fails the job as soon as one stops holding.
      - name: webpki 0.26 shim guard (scoped RUSTSEC-2026-0381 / -0383 exceptions)
        run: bash scripts/check-webpki-shims.sh

      # #306: cargo audit (and cargo deny) match no advisory against a path
      # crate, so the vendored object 0.32.2 is audited as the crates.io crate
      # it is apart from its default features. vendored-object.yml also runs
      # this daily.
      - name: cargo-audit — vendored object 0.32.2 as its crates.io identity (#306)
        run: bash scripts/check-vendored-object.sh advisories

      # RUSTSEC-2026-0186: the same for the vendored memmap2 0.5.10 and 0.6.2. Every
      # advisory against their crates.io identities fails except that one, which
      # their backported bounds checks fix. vendored-object.yml also runs this daily.
      - name: cargo-audit — vendored memmap2 0.5.10 / 0.6.2 as their crates.io identities (RUSTSEC-2026-0186)
        run: bash scripts/check-vendored-memmap2.sh advisories

      # RUSTSEC-2026-0253 / RUSTSEC-2026-0002: the same for the vendored lru 0.12.5.
      # Every advisory against its crates.io identity fails except those two, which
      # the backported fixes address. vendored-object.yml also runs this daily.
      - name: cargo-audit — vendored lru 0.12.5 as its crates.io identity (RUSTSEC-2026-0253, RUSTSEC-2026-0002)
        run: bash scripts/check-vendored-lru.sh advisories

  build-test-clippy-aarch64:
    # C3 (issue #127 dependency hardening): build/test/clippy the ENTIRE workspace
    # — including the `blst`-backed `sumchain-beacon-crypto` now linked into
    # production binaries via `state -> beacon-runtime -> beacon-crypto` — on native
    # aarch64 (`ubuntu-24.04-arm`), so the vendored `blst` C/assembly compiles and
    # the workspace tests pass on aarch64 as well as x86_64.
    #
    # NOTE: this runs on every PR/push for coverage, but it is NOT a
    # branch-protection required context. To make aarch64 a MERGE GATE, an admin
    # must add `build-test-clippy-aarch64` to main's required status checks.
    runs-on: ubuntu-24.04-arm
    env:
      CXXFLAGS: "-include cstdint"
      # Disk headroom: as for build-test-clippy above.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain
        run: |
          rustup show
          rustup component add clippy

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # A separate cache key: never restore a target directory built with
      # full debug info into these line-table builds.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: dev-debug-line-tables-only

      # #117 CONSOLIDATE leaf-guard: `sumchain-wire` is the single source-of-truth for every
      # wire/primitive byte-format and MUST stay a pure LEAF — it may depend on external crates only,
      # never on a workspace-internal crate. Every internal dependency takes the form of a `path`
      # dependency, so any path dep of `sumchain-wire` is a wrong-way edge and fails the guard.
      # `cargo metadata` resolves without building; jq is preinstalled on ubuntu-latest.
      - name: sumchain-wire leaf-dependency guard (#117)
        run: |
          bad=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="sumchain-wire") | .dependencies[] | select(.path != null) | .name')
          if [ -n "$bad" ]; then
            echo "::error::sumchain-wire must stay a pure leaf (single wire source-of-truth) but has workspace-internal (path) deps: $bad"
            exit 1
          fi
          echo "ok - sumchain-wire is a pure leaf (no workspace-internal dependencies)"

      # #127 reconciliation guard: fail if any SUPERSEDED beacon construct (the dead
      # ECIES :key/:aad tags, XChaCha20 / Ristretto / Curve25519 / zero-nonce in
      # beacon code, hardcoded finality_depth(6), or the stale "carriers not landed"
      # comment) re-appears. Ratified rejection NOTES in doc-comments/spec are allowed.
      - name: BR1 reconciliation regression guard (#127)
        run: bash scripts/br1-reconciliation-guard.sh

      # Disk headroom (the x86_64 job once ran out of space linking test
      # binaries): the runner's free space and what the build tree holds.
      - name: Disk usage before build
        run: |
          df -h /
          du -sh target "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Disk usage after build and test
        if: always()
        run: |
          df -h /
          du -sh target target/debug/deps target/debug/build "$HOME/.cargo/registry" 2>/dev/null || true

      - name: Clippy (workspace, tests)
        run: cargo clippy --workspace --tests --locked
