name: release-image

# Publishes ONE immutable release image of the node to GHCR, for one merged,
# approved commit and one platform. Manually triggered only.
#
#   ghcr.io/<owner>/sum-chain:<40-hex commit>-<arch>     never `latest`, never reused
#
# Refuses, before building, unless:
#   * it runs from the workflow file on main;
#   * <commit> is a full 40-hex sha that is an ancestor of main;
#   * <commit> is the head (or merge commit) of a merged pull request into main
#     that has an APPROVED review on its head -- an unmerged or unapproved
#     commit is never published;
#   * the tag does not already exist -- a published tag is never overwritten.
#
# Then builds with the pinned Rust 1.88.0 image and --locked (the Dockerfile),
# embeds the commit (GIT_HASH), attaches an SPDX SBOM and SLSA provenance,
# pushes, reads back the registry digest, and proves the pushed digest with
# tools/release/verify-image.sh (tag, platform, commit, SBOM, provenance,
# genesis) and tools/release/smoke-image.sh (/health, /ready, /metrics).
# Last, it creates a GitHub artifact attestation and verifies it.
#
# One platform per run, built and run natively. linux/amd64 is what CI builds
# and tests on every change; publish linux/arm64 only if production runs it.
# No multi-architecture manifest is created.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full 40-hex commit on main to publish (the approved, merged PR head)'
        required: true
        type: string
      platform:
        description: 'Platform to build and test natively'
        required: true
        default: linux/amd64
        type: choice
        options: [linux/amd64, linux/arm64]

permissions: {}

concurrency:
  group: release-image-${{ inputs.commit }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  gate:
    name: refuse unmerged or unapproved commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.approval.outputs.pr }}
    steps:
      - name: Dispatched from main, with a full commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::dispatch from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-hex sha"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The commit is on main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git cat-file -e "$COMMIT^{commit}" || { echo "::error::$COMMIT does not exist"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$COMMIT is not on main; unmerged commits are never published"; exit 1; }

      - name: The commit is an approved, merged pull request
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"main\"
                           and (.head.sha == \"$COMMIT\" or .merge_commit_sha == \"$COMMIT\"))][0] // empty")
          [[ -n $pr ]] || { echo "::error::$COMMIT is not the head or merge commit of a merged PR into main"; exit 1; }
          num=$(jq -r .number <<<"$pr"); head=$(jq -r .head.sha <<<"$pr")
          approved=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$num/reviews" --jq \
            "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$head\") | .user.login] | unique | join(\",\")")
          [[ -n $approved ]] || { echo "::error::PR #$num has no APPROVED review on its head $head"; exit 1; }
          echo "PR #$num merged, head $head approved by $approved"
          echo "pr=$num" >> "$GITHUB_OUTPUT"

  publish:
    name: build, push, verify, attest (${{ inputs.platform }})
    needs: gate
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    # REQUIRED repository setting, not enforced by this file: environment
    # "release" with required reviewers and deployment branches limited to main
    # (docs/operations/release-image.md). GitHub creates a missing environment
    # with NO protection, so until it is configured nothing here waits for a
    # human beyond the gate job's approved-PR check.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ inputs.commit }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$COMMIT" ]] || { echo "::error::checked out $(git rev-parse HEAD)"; exit 1; }
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          echo "image=ghcr.io/$owner/sum-chain" >> "$GITHUB_OUTPUT"
          echo "tag=$COMMIT-${PLATFORM#*/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse an existing tag (published tags are immutable)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists: $(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest). It is never overwritten; use that digest."
            exit 1
          fi

      - name: Build and push (pinned toolchain, --locked, commit embedded, SBOM, provenance)
        id: build
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build --platform "$PLATFORM" \
            --build-arg GIT_HASH="$COMMIT" \
            --label org.opencontainers.image.revision="$COMMIT" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --sbom=true --provenance=mode=max \
            --metadata-file meta.json \
            -t "$IMAGE:$TAG" --push .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in build metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the pushed digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tools/release/verify-image.sh --image "$IMAGE" --tag "$TAG" --digest "$DIGEST" --commit "$COMMIT" --platform "$PLATFORM"

      - name: Smoke test the pushed digest
        run: bash tools/release/smoke-image.sh "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the GitHub attestation, and record the release
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          bash tools/release/verify-image.sh --image "$IMAGE" --tag "$TAG" --digest "$DIGEST" \
            --commit "$COMMIT" --platform "$PLATFORM" --require-github-attestation "$GITHUB_REPOSITORY"
          bin=$(docker run --rm --entrypoint sha256sum "$IMAGE@$DIGEST" /usr/local/bin/sumchain | cut -d' ' -f1)
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' > sbom.spdx.json
          {
            echo "commit:          $COMMIT"
            echo "pull_request:    #${{ needs.gate.outputs.pr }}"
            echo "platform:        $PLATFORM"
            echo "image:           $IMAGE@$DIGEST"
            echo "tag:             $IMAGE:$TAG"
            echo "binary_sha256:   $bin"
            echo "workflow_run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee release-record.txt
          { echo '```'; cat release-record.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.commit }}-${{ steps.name.outputs.tag }}
          path: |
            release-record.txt
            sbom.spdx.json
            meta.json
          retention-days: 400
