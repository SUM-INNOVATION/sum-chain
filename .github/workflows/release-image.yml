name: release-image

# Publishes ONE immutable, multi-platform release image of the node to GHCR,
# for the commit at the head of main. Manually triggered only.
#
#   ghcr.io/sum-innovation/sum-chain:<40-hex commit>  ->  sha256:<canonical OCI index>
#
# The canonical index holds exactly two runnable images, linux/amd64 and
# linux/arm64, each with its BuildKit attestation manifest (SBOM, provenance).
# Container runtimes pull the child for their own platform, so no operator
# has to know which platform production runs. The deployment-facing identity is
# the canonical index DIGEST; the children are joined into it by digest. No
# other tag is pushed, and `latest` never is.
#
# Jobs, and what each may do:
#   gate     read-only. Refuses unless dispatched from main, the commit is a
#            full 40-hex sha that IS the head of main at dispatch (so GitHub's
#            signed provenance names the commit that is built), and it is the
#            head or merge result of a merged pull request whose head carries
#            an APPROVED review.
#   build    read-only, no registry credential. One native job per platform
#            (ubuntu-24.04, ubuntu-24.04-arm): build from the pinned Dockerfile
#            with --locked and GIT_HASH, smoke-test the image, and export it as
#            an OCI layout with SBOM and SLSA v1 provenance.
#   publish  the ONLY job with packages: write, and it runs in environment
#            `release` (required reviewer, self-review prevented, main only,
#            admin bypass off). Pushes both layouts by digest, joins them into
#            the canonical index under the commit tag (refused if it exists),
#            reads everything back by digest and verifies it, then creates and
#            verifies GitHub artifact attestations for the index and both
#            children.
#   verify   read-only. One native job per platform: pull that child by digest
#            from GHCR, check --version, /health, /ready and /metrics, and
#            re-verify the index and attestations independently.
#   record   read-only. Writes release-record.txt and the job summary.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full 40-hex commit: the current head of main (an approved, merged PR head)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-image-${{ inputs.commit }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sum-innovation/sum-chain
  COMMIT: ${{ inputs.commit }}

jobs:
  gate:
    name: refuse unmerged, unapproved or stale commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.approval.outputs.pr }}
      approved_by: ${{ steps.approval.outputs.approved_by }}
    steps:
      - name: Dispatched from main, for the head of main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::dispatch from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-hex sha"; exit 1; }
          # GITHUB_SHA is the head of main at dispatch; GitHub's signed
          # provenance records it as the source commit. Requiring equality makes
          # the signed source commit and the built commit one and the same.
          [[ "$COMMIT" == "$GITHUB_SHA" ]] \
            || { echo "::error::$COMMIT is not the head of main ($GITHUB_SHA); dispatch while it is"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The commit is on main
        run: |
          set -euo pipefail
          git cat-file -e "$COMMIT^{commit}" || { echo "::error::$COMMIT does not exist"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$COMMIT is not on main; unmerged commits are never published"; exit 1; }

      - name: The commit is an approved, merged pull request
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"main\"
                           and (.head.sha == \"$COMMIT\" or .merge_commit_sha == \"$COMMIT\"))][0] // empty")
          [[ -n $pr ]] || { echo "::error::$COMMIT is not the head or merge commit of a merged PR into main"; exit 1; }
          num=$(jq -r .number <<<"$pr"); head=$(jq -r .head.sha <<<"$pr")
          approved=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$num/reviews" --jq \
            "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$head\") | .user.login] | unique | join(\",\")")
          [[ -n $approved ]] || { echo "::error::PR #$num has no APPROVED review on its head $head"; exit 1; }
          echo "PR #$num merged, head $head approved by $approved"
          { echo "pr=$num"; echo "approved_by=$approved"; } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.platform }} (native, no credentials)
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build, smoke-test and export ${{ matrix.platform }}
        run: >-
          bash tools/release/build-child.sh "${{ matrix.platform }}" "$COMMIT" "$RUNNER_TEMP/out"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: child-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: publish the canonical index (protected)
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Environment "release": Mike-Mans must approve, and cannot approve a run
    # he dispatched; main only; admin bypass disabled. This is the only job
    # holding packages: write.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
      amd64: ${{ steps.push.outputs.amd64 }}
      arm64: ${{ steps.push.outputs.arm64 }}
    env:
      OCI_USERNAME: ${{ github.actor }}
      OCI_PASSWORD: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: child-*
          path: ${{ runner.temp }}/in

      - name: Refuse an existing release tag
        run: python3 tools/release/oci.py absent "$IMAGE" "$COMMIT"

      - name: Push both children by digest (no tags)
        id: push
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            in="$RUNNER_TEMP/in/child-$arch"
            python3 tools/release/oci.py push-layout "$in/child-$arch.tar" "$IMAGE" \
              --platform "linux/$arch" --commit "$COMMIT" > "$RUNNER_TEMP/pushed-$arch.json"
            # What was published is exactly what the build job built and tested.
            cmp <(jq -S . "$in/child-$arch.json") <(jq -S . "$RUNNER_TEMP/pushed-$arch.json") \
              || { echo "::error::pushed linux/$arch child differs from the built one"; exit 1; }
            echo "$arch=$(jq -r .image "$RUNNER_TEMP/pushed-$arch.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Join them by digest under the commit tag
        id: join
        run: |
          set -euo pipefail
          d=$(python3 tools/release/oci.py assemble "$IMAGE" --tag "$COMMIT" \
                "$(jq -r .child_index "$RUNNER_TEMP/pushed-amd64.json")" \
                "$(jq -r .child_index "$RUNNER_TEMP/pushed-arm64.json")")
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Read back by digest and verify the index, children, SBOMs and provenance
        run: >-
          python3 tools/release/verify-release.py --mode release --image "$IMAGE" --commit "$COMMIT"
          --digest "${{ steps.join.outputs.digest }}"
          --child "linux/amd64=${{ steps.push.outputs.amd64 }}" --child "linux/arm64=${{ steps.push.outputs.arm64 }}"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --summary "$RUNNER_TEMP/verify-release.json"

      - name: Attest the canonical index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

      - name: Attest the linux/amd64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64 }}
          push-to-registry: true

      - name: Attest the linux/arm64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64 }}
          push-to-registry: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the attestations under the release policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for d in "${{ steps.join.outputs.digest }}" "${{ steps.push.outputs.amd64 }}" "${{ steps.push.outputs.arm64 }}"; do
            bash tools/release/verify-attestation.sh "$IMAGE" "$d" "$COMMIT"
          done

      - name: Keep the verification summary and SBOMs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keep"
          cp "$RUNNER_TEMP/verify-release.json" "$RUNNER_TEMP/keep/"
          for p in linux/amd64 linux/arm64; do
            for layer in $(jq -r --arg p "$p" '.children[$p].sboms[].layer' "$RUNNER_TEMP/verify-release.json"); do
              python3 tools/release/oci.py blob "$IMAGE" "$layer" \
                > "$RUNNER_TEMP/keep/sbom-${p#linux/}-${layer#sha256:}.intoto.json"
            done
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish
          path: ${{ runner.temp }}/keep/
          retention-days: 400
          if-no-files-found: error

  verify:
    name: verify ${{ matrix.platform }} from GHCR (native, read-only)
    needs: [build, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    env:
      OCI_USERNAME: ${{ github.actor }}
      OCI_PASSWORD: ${{ github.token }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      AMD64: ${{ needs.publish.outputs.amd64 }}
      ARM64: ${{ needs.publish.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: child-${{ matrix.arch }}
          path: ${{ runner.temp }}/built

      - name: Re-verify the index, both children and the attestations, independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/release/verify-release.py --mode release --image "$IMAGE" --commit "$COMMIT" \
            --digest "$DIGEST" --child "linux/amd64=$AMD64" --child "linux/arm64=$ARM64" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for d in "$DIGEST" "$AMD64" "$ARM64"; do
            bash tools/release/verify-attestation.sh "$IMAGE" "$d" "$COMMIT"
          done

      - name: Run the ${{ matrix.platform }} child pulled by digest
        run: |
          set -euo pipefail
          child=$([[ "${{ matrix.arch }}" == amd64 ]] && echo "$AMD64" || echo "$ARM64")
          bash tools/release/verify-child-runtime.sh "$IMAGE" "$child" "$COMMIT" "${{ matrix.platform }}" \
            > "$RUNNER_TEMP/runtime-${{ matrix.arch }}.json"
          built=$(cat "$RUNNER_TEMP/built/binary-${{ matrix.arch }}.sha256")
          got=$(jq -r .binary_sha256 "$RUNNER_TEMP/runtime-${{ matrix.arch }}.json")
          [[ $got == "$built" ]] || { echo "::error::published binary $got differs from the built $built"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-${{ matrix.arch }}.json
          retention-days: 400
          if-no-files-found: error

  record:
    name: release record
    needs: [gate, publish, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/in

      - name: Write the release record
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/in"
          python3 tools/release/release-record.py --summary "$in/publish/verify-release.json" \
            --runtime "$in/runtime-amd64/runtime-amd64.json" --runtime "$in/runtime-arm64/runtime-arm64.json" \
            --pr "${{ needs.gate.outputs.pr }}" --approved-by "${{ needs.gate.outputs.approved_by }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --attestation "verified for the canonical index and both children: signed by $GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/heads/main, source $COMMIT" \
            | tee "$RUNNER_TEMP/release-record.txt"
          { echo '```'; cat "$RUNNER_TEMP/release-record.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/release-record.txt" "$in"/publish/* "$in"/runtime-*/*.json "$RUNNER_TEMP/release/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.commit }}
          path: ${{ runner.temp }}/release/
          retention-days: 400
          if-no-files-found: error
