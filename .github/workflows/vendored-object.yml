name: vendored-object

# #306: object 0.32.2 is patched to crates/third_party/object-0.32.2, the
# crates.io crate with "compression" dropped from its default features.
#   * vendored object advisories: the vendored copy is the crates.io crate but
#     for that one hunk, and RustSec has no advisory against the crates.io
#     object 0.32.2 it stands for. Neither cargo audit nor cargo deny matches
#     advisories against a path crate, so this is the advisory check that covers
#     it. It also runs daily, so a new advisory surfaces without a PR. (The same
#     advisories check runs in rust-ci's supply-chain-audit on every PR.)
#   * vendored memmap2 0.5.10 and 0.6.2 (RUSTSEC-2026-0186): the same two checks
#     for crates/third_party/memmap2-*, the crates.io crates with memmap2
#     0.9.11's bounds checks backported (scripts/check-vendored-memmap2.sh).
#   * vendored lru 0.12.5 (RUSTSEC-2026-0253, RUSTSEC-2026-0002): the same two
#     checks for crates/third_party/lru-0.12.5, the crates.io crate with
#     upstream's pop and IterMut fixes backported, and a job running the
#     backported regressions natively and under Miri, plus, under Miri, against
#     the crates.io source with only the regressions added, where they must
#     report undefined behaviour (scripts/check-vendored-lru.sh).
#   * wasmer artifacts base vs head: Module::serialize() of the test WAT corpus,
#     plain and metered Singlepass, is byte-identical at the PR's merge base and
#     head, on x86_64 and aarch64 Linux (scripts/compare-wasmer-artifacts.sh).

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/sumc-runtime/Cargo.toml
      - crates/third_party/**
      - crates/sumc-runtime/examples/artifact_hash.rs
      - scripts/check-vendored-object.sh
      - scripts/check-vendored-memmap2.sh
      - scripts/check-vendored-lru.sh
      - scripts/compare-wasmer-artifacts.sh
      - .cargo/audit.toml
      - .github/workflows/vendored-object.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: vendored object advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain
        run: rustup show

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Vendored object 0.32.2 is the crates.io crate but for its default features
        run: bash scripts/check-vendored-object.sh source

      - name: No RustSec advisory against crates.io object 0.32.2, the vendored copy's identity
        run: bash scripts/check-vendored-object.sh advisories

      - name: Vendored memmap2 0.5.10 / 0.6.2 are the crates.io crates but for the backported bounds checks
        run: bash scripts/check-vendored-memmap2.sh source

      - name: No RustSec advisory but RUSTSEC-2026-0186 against crates.io memmap2 0.5.10 / 0.6.2
        run: bash scripts/check-vendored-memmap2.sh advisories

      - name: Vendored lru 0.12.5 is the crates.io crate but for the backported fixes and their regressions
        run: bash scripts/check-vendored-lru.sh source

      - name: No RustSec advisory but RUSTSEC-2026-0253 / RUSTSEC-2026-0002 against crates.io lru 0.12.5
        run: bash scripts/check-vendored-lru.sh advisories

  lru-regressions:
    name: vendored lru regressions (native and Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The nightly whose Miri the regressions were validated with.
      MIRI_TOOLCHAIN: nightly-2026-10-23
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain
        run: rustup show

      - name: Install the pinned nightly with Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src

      - name: Backported regressions pass natively
        run: bash scripts/check-vendored-lru.sh regressions

      - name: Backported regressions pass under Miri
        run: bash scripts/check-vendored-lru.sh regressions --miri

      - name: Without the fixes, Miri reports undefined behaviour in every regression
        run: bash scripts/check-vendored-lru.sh regressions --miri --without-fixes

  artifacts:
    name: wasmer artifacts base vs head (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # librocksdb-sys (via sumc-runtime -> sumchain-storage); see rust-ci.yml.
      CXXFLAGS: "-include cstdint"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pinned toolchain
        run: rustup show

      - name: Compiled artifacts at the merge base and the head are byte-identical
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/compare-wasmer-artifacts.sh "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA"
