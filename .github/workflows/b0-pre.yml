name: B0-PRE tools

# B0-PRE RETIRED (#196). The B0 measurement phase is closed — RISC0 was selected and the official
# evidence sealed (release b0-final-evidence-60ace32c / commit 9cccaa5e; see docs/b0-final/). The
# PRODUCTION MEASUREMENT WORKFLOW is disabled: current `main` cannot produce a new official B0
# measurement (the live tooling authority is UNBOUND and every producer fails closed). This workflow
# no longer runs the venue-script selftest, the real-container seal->import E2E, or the heavyweight
# provisioning / real-backend-compile steps. It now only:
#   * asserts the retirement marker + that production measurement refuses fail-closed, and
#   * keeps the FROZEN tool crates (vmat / validator / independent / measure-core / host-provenance)
#     COMPILING with their off-venue unit suites green.
# Historical evidence is verified from the tagged historical commit/release, never current `main`
# (docs/b0-final/B0-PRE-RETIREMENT.md). Full retire/retarget of the historical whole-tree B15 guard
# for any future b0-pre tooling work remains tracked in #196.

on:
  pull_request:
    paths:
      - "tools/b0-pre-vmat/**"
      - "tools/b0-pre-validator/**"
      - "tools/b0-pre-independent/**"
      - "tools/b0-pre-measure-core/**"
      - "tools/b0-pre-host-provenance/**"
      - "tools/b0-pre-candidates/**"
      - "docs/b0-pre/**"
      - "docs/b0-final/**"
      - ".github/workflows/b0-pre.yml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "tools/b0-pre-vmat/**"
      - "tools/b0-pre-validator/**"
      - "tools/b0-pre-independent/**"
      - "tools/b0-pre-measure-core/**"
      - "tools/b0-pre-host-provenance/**"
      - "tools/b0-pre-candidates/**"
      - "docs/b0-pre/**"
      - "docs/b0-final/**"
      - ".github/workflows/b0-pre.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VMAT: tools/b0-pre-vmat
  VAL: tools/b0-pre-validator
  IND: tools/b0-pre-independent
  MEAS_CORE: tools/b0-pre-measure-core
  PROV: tools/b0-pre-host-provenance

jobs:
  b0-pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml (channel 1.85.0) — the validator-tool compatibility floor.
      - name: Set up pinned toolchain (validator-tool floor)
        run: |
          rustup show
          rustup component add clippy rustfmt

      # --- B0-PRE RETIREMENT contract (#196) ---------------------------------
      # Assert the retirement marker + UNBOUND live authority, and prove the shared production gate
      # `require_two_roots` refuses fail-closed with B0_PRE_RETIRED. Marker-asserted.
      - name: B0-PRE retirement contract (production measurement disabled; fail-closed)
        run: |
          set +e
          bash tools/b0-pre-candidates/scripts/tests/b0_pre_retired.test.sh 2>&1 | tee /tmp/retired.out
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::B0-PRE retirement contract failed ($rc)"; exit 1; }
          grep -q '^B0_PRE_RETIRED_TEST_PASS$' /tmp/retired.out \
            || { echo "::error::retirement marker B0_PRE_RETIRED_TEST_PASS absent"; exit 1; }

      # --- Isolation / dependency boundary (unchanged by retirement) ---------
      - name: Workspace exclusion + no production dependency
        run: bash "$VAL/scripts/check_no_prod_dep.sh"

      # --- Frozen tool crates still COMPILE + unit suites green (off-venue) ---
      # No venue, no proving, no toolchain download. These prove the retired tooling remains buildable
      # and that the retirement changes did not break the decoders/validators.
      - name: b0-pre-vmat (test / clippy / fmt / locked)
        run: |
          cargo test   --locked --manifest-path "$VMAT/Cargo.toml"
          cargo clippy --locked --manifest-path "$VMAT/Cargo.toml" --all-targets -- -D warnings
          cargo fmt    --manifest-path "$VMAT/Cargo.toml" --check
          cargo build  --locked --manifest-path "$VMAT/Cargo.toml" --all-targets
          git diff --exit-code -- "$VMAT/Cargo.lock"

      - name: validator + independent (build / fmt / clippy / test, locked)
        run: |
          cargo build  --locked --manifest-path "$VAL/Cargo.toml" --all-targets
          cargo build  --locked --manifest-path "$IND/Cargo.toml" --all-targets
          git diff --exit-code -- "$VAL/Cargo.lock" "$IND/Cargo.lock"
          cargo fmt    --manifest-path "$VAL/Cargo.toml" --check
          cargo fmt    --manifest-path "$IND/Cargo.toml" --check
          cargo clippy --locked --manifest-path "$VAL/Cargo.toml" --all-targets -- -D warnings
          cargo clippy --locked --manifest-path "$IND/Cargo.toml" --all-targets -- -D warnings
          cargo test   --locked --manifest-path "$VAL/Cargo.toml"
          cargo test   --locked --manifest-path "$IND/Cargo.toml"

      - name: measurement core + provenance reader (fmt / clippy / test)
        run: |
          cargo fmt    --manifest-path "$MEAS_CORE/Cargo.toml" --check
          cargo fmt    --manifest-path "$PROV/Cargo.toml" --check
          cargo clippy --manifest-path "$MEAS_CORE/Cargo.toml" --all-targets -- -D warnings
          cargo clippy --manifest-path "$PROV/Cargo.toml" --all-targets -- -D warnings
          cargo test   --manifest-path "$MEAS_CORE/Cargo.toml"
          cargo test   --manifest-path "$PROV/Cargo.toml"
