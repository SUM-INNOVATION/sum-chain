# Drop-in that points the validator unit at ONE verified, side-by-side release.
#
#   sudo install -m 0644 sumchain-release.conf /etc/systemd/system/sumchain.service.d/release.conf
#   (after editing <commit> and keeping the unit's own arguments), then
#   sudo systemctl daemon-reload
#
# Use it only as docs/operations/stage1-native-runbook.md says: after
# tools/release/install-native.sh installed the release, and after
# tools/lane-b/native-preflight.py passed both phases. Never point it at a
# binary built on the host.
#
# No KillSignal line. The node handles SIGTERM, systemd's default stop signal,
# through the same graceful shutdown as SIGINT, and exits 0
# (crates/node/tests/graceful_shutdown.rs). TimeoutStopSec only bounds how long
# systemd waits for that.
[Service]
ExecStart=
ExecStart=/opt/sumchain/releases/<commit>/sumchain run --config config.toml --genesis genesis.json --bootnodes <unchanged from the unit>
TimeoutStopSec=90
