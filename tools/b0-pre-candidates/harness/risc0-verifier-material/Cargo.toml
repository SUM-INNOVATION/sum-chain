[package]
name = "b0-pre-risc0-verifier-material"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Deterministic extraction + contract test for the immutable material consumed by the pinned RISC Zero 3.0.5 Groth16 receipt verifier. Builds/runs only on a native x86_64 container venue."

# Pinned to the RISC Zero candidate. Verifier-material bytes are READ from these
# crates at run time; never hardcoded.
#
# The canonical manifest encoding / identity / labels come from the SHARED
# `b0-pre-vmat` leaf (blake3-only) that the reference validator also uses — this
# crate hand-rolls no wire replica. Tool-only path dependency; adds no candidate
# or guest edge and does not touch candidates/{sp1,risc0}/Cargo.lock.
[dependencies]
b0-pre-vmat = { path = "../../../b0-pre-vmat" }
risc0-zkvm = "=3.0.5"
risc0-groth16 = "=3.0.4"
# Cluster-pinned identically with b0-pre-vmat (=1.6.1, SMOKE-BLOCKED-005). risc0-zkvm
# 3.0.5 alone resolves fine at 1.5.4, but this harness shares the b0-pre-vmat leaf,
# which is exact-pinned =1.6.1, so it moves with the cluster to avoid version skew.
blake3 = "=1.6.1"
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
