[package]
name = "b0-pre-measure-risc0"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "B0-FINAL RISC Zero measurement runner (venue, x86_64-only). Real RISC Zero 3.0.5 Groth16 proving behind --features real-backend; the production binary refuses to build without it. The guest ELF + image id are produced by risc0_build::embed_methods() (build.rs) with the pinned local toolchain and BOUND as the guest identity; receipt.verify(image_id) decodes+checks the binding. Verifier material comes from the risc0-verifier-material harness JSON. The ONLY venue-only piece is the SDK/Docker crypto + guest toolchain."

[[bin]]
name = "b0-pre-measure-risc0"
path = "src/main.rs"

[features]
# Enabling the real RISC Zero SDK + build makes this a runnable production binary. CI
# builds with this feature to type-check the crypto path; embed_methods only runs under a
# venue (B0_VENUE_EMBED) since it needs the pinned guest toolchain — CI gets a stub so the
# crate type-checks, and the runtime refuses an empty embedded ELF.
real-backend = ["dep:risc0-zkvm", "dep:bincode", "dep:risc0-build"]

[dependencies]
b0-pre-measure-core = { path = "../b0-pre-measure-core" }
blake3 = "=1.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }

# Venue-only crypto boundary — the SAME pins prove_fixture.sh's runner uses.
risc0-zkvm = { version = "=3.0.5", optional = true }
bincode = { version = "=1.3.3", optional = true }

[build-dependencies]
# embed_methods builds the frozen guest with the pinned local r0 toolchain (venue only).
risc0-build = { version = "=3.0.5", optional = true }
# §G real-embed canonicalization (build.rs): copy the guest ELF into OUT_DIR and verify the copy
# byte-for-byte (cmp) AND by SHA-256 + BLAKE3. Same pins already resolved in the runner graph.
sha2 = "=0.10.9"
blake3 = "=1.6.1"

# embed_methods reads this to locate + build the frozen official guest (venue path).
[package.metadata.risc0]
methods = ["../b0-pre-candidates/candidates/risc0/guest"]

[workspace]
