[package]
name = "sumchain-state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "State management and transaction execution for SUM Chain"

[dependencies]
sumchain-primitives = { path = "../primitives" }
sumchain-crypto = { path = "../crypto" }
sumchain-storage = { path = "../storage" }
sumchain-genesis = { path = "../genesis" }
sumchain-nft = { path = "../nft" }
# BR1 randomness-beacon (#127) gate-closed runtime — the crypto/threshold/membership
# validation the beacon executor seam reaches on the gate-open path. Pulls the
# `blstrs`-backed adapter transitively (confined to that adapter). Dormant by default.
sumchain-beacon-runtime = { path = "../beacon-runtime" }
sumc-runtime = { path = "../sumc-runtime" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
lru = "0.12"

[dev-dependencies]
# `JournalActivation::pinned` is feature-gated OFF in production builds, so it
# exists only for test targets that need a boundary with no database behind it.
sumchain-storage = { path = "../storage", features = ["activation-fixtures"] }
tempfile = "3.10"
wat = "1"
# `remediation_gates.rs` round-trips ChainParams through JSON to prove a genesis
# written before the eleven remediation fields existed still parses dormant.
serde_json = { workspace = true }
# Build a REAL beacon carrier (valid EK + PoP) to exercise the gate-open →
# #127-runtime → fail-closed-pending-stateful path end to end.
sumchain-beacon-crypto = { path = "../beacon-crypto" }

[features]
# Test modules that were written against pre-migration primitives schemas and
# were gated off while they did not compile. They compile and pass now:
# `cargo test -p sumchain-state --all-targets --features legacy_tests` is
# 1053 passed / 0 failed / 1 ignored. They stay behind a feature because they
# are per-executor unit tests that overlap the `tests/` suites, not because
# they are expected to fail. Anything that breaks them is a real break.
legacy_tests = []
