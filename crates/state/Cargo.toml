[package]
name = "sumchain-state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "State management and transaction execution for SUM Chain"

[dependencies]
sumchain-primitives = { path = "../primitives" }
sumchain-crypto = { path = "../crypto" }
sumchain-storage = { path = "../storage" }
sumchain-genesis = { path = "../genesis" }
sumchain-nft = { path = "../nft" }
# BR1 randomness-beacon (#127) gate-closed runtime — the crypto/threshold/membership
# validation the beacon executor seam reaches on the gate-open path. Pulls the
# `blstrs`-backed adapter transitively (confined to that adapter). Dormant by default.
sumchain-beacon-runtime = { path = "../beacon-runtime" }
sumc-runtime = { path = "../sumc-runtime" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
lru = "0.12"

[dev-dependencies]
# `JournalActivation::pinned` is feature-gated OFF in production builds, so it
# exists only for test targets that need a boundary with no database behind it.
sumchain-storage = { path = "../storage", features = ["activation-fixtures"] }
tempfile = "3.10"
wat = "1"
# `remediation_gates.rs` round-trips ChainParams through JSON to prove a genesis
# written before the eleven remediation fields existed still parses dormant.
serde_json = { workspace = true }
# Build a REAL beacon carrier (valid EK + PoP) to exercise the gate-open →
# #127-runtime → fail-closed-pending-stateful path end to end.
sumchain-beacon-crypto = { path = "../beacon-crypto" }
# `equity_ownership_proof_claim.rs` hand-rolls a `tracing::Subscriber` to
# assert what the Equity proof-write path SAYS, not only what it returns.
# The library's own `tracing` is not reachable from an integration test, and a
# subscriber crate is not worth pulling in to read one string.
tracing = { workspace = true }

[features]
# Test modules that were written against pre-migration primitives schemas and
# were gated off while they did not compile. They compile and pass. They stay
# behind a feature because they are per-executor unit tests that overlap the
# `tests/` suites, not because they are expected to fail. Anything that breaks
# them is a real break.
#
# TEST-ONLY, AND THAT IS STRUCTURAL: every use site in this crate is
# `#[cfg(all(test, feature = "legacy_tests"))]`, the feature is in no
# `default` list, and no crate that ships in a release binary enables it.
# A release build cannot turn it on.
#
# One of these modules WAS uncompilable, inherited from 8789f6b and earlier:
# `nft_executor.rs`'s `test_create_collection` called
# `execute_create_collection` with four arguments while the function grew two
# gate parameters (`collection_id_nonce`, then `unpayable_royalty_refused`).
# A gated-off module does not get rebuilt, so the arity drifted twice without
# anything noticing. Repaired with both gates closed, which is the
# configuration the case was written against.
legacy_tests = []
