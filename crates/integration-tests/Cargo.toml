[package]
name = "sumchain-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
sumchain-primitives = { path = "../primitives" }
sumchain-crypto = { path = "../crypto" }
sumchain-storage = { path = "../storage" }
sumchain-genesis = { path = "../genesis" }
sumchain-state = { path = "../state" }
sumchain-consensus = { path = "../consensus" }
sumchain-p2p = { path = "../p2p" }
sumchain-rpc = { path = "../rpc" }
sumchain-nft = { path = "../nft" }

tokio = { workspace = true }
tempfile = "3.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }

[features]
# `stress_tests.rs`, gated off while it was written against an older
# `NftExecutor::execute` signature. It compiles and passes now:
# `cargo test -p sumchain-integration-tests --features legacy_tests` is
# 56 passed / 0 failed. It stays behind a feature because it is a throughput
# stress module whose runtime does not belong in the default gate, not because
# it is expected to fail. Mirrors `crates/state/Cargo.toml`.
legacy_tests = []
