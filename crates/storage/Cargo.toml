[package]
name = "sumchain-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Persistent storage for SUM Chain using RocksDB"

[dependencies]
sumchain-primitives = { path = "../primitives" }
rocksdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }

[features]
# Constructors that fabricate a `JournalActivation` without a database.
#
# OFF in every production build, so `JournalActivation::pinned` is not reachable
# from the node binary at all: the only way production code can obtain an
# activation is `JournalActivation::resolve`, which reads this database's own
# undo-history floor and cannot be talked out of it. Enabled through
# dev-dependencies by the crates whose TESTS need a boundary with no database
# behind it (`sumchain-state`, `sumchain-consensus`).
activation-fixtures = []

# A per-thread override of the legacy root-compatibility window, for tests that
# must see a state-root mismatch REFUSED at heights a test chain can reach (the
# window covers every height up to 496,720). OFF in every production build, and
# inert unless a test sets it on its own thread. Enabled through
# dev-dependencies by `sumchain-consensus`.
test-hooks = []

[dev-dependencies]
tempfile = "3.10"
